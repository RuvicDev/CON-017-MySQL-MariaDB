[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-mysql-connector"
version = "1.0.0"
description = "Conector Ruvic de solo lectura para MySQL / MariaDB"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_mysql_connector*"]
